{% extends "base.html" %}

{% block title %}
Create Account
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🚀
        </div>

        <h1>
            Create Account
        </h1>

        <p>
            Start your smarter student journey.
        </p>

        <form method="POST">

            <label>
                Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Your name"
                required
            >

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Your email"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 6 characters"
                required
            >

            <button
                type="submit"
                class="primary-button full">

                Create Account

            </button>

        </form>

        <p class="auth-bottom">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
